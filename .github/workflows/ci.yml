name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  security-events: write
  # Lecture seule : l'action CodeQL lit l'exécution en cours pour sa télémétrie
  # (sinon, avertissement « Resource not accessible by integration »).
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # La version de pnpm n'est pas fixée ici : pnpm/action-setup lit le champ
  # "packageManager" de package.json. La déclarer aussi dans ce fichier fait
  # échouer l'action dès que les deux versions divergent.

# Actions en versions majeures qui tournent sur Node 24 : les versions
# précédentes (runtime Node 20) déclenchent l'avertissement de dépréciation.
jobs:
  # ---------------------------------------------------------------------------
  # Lint, typecheck, unit tests, content/i18n integrity
  # ---------------------------------------------------------------------------
  quality:
    name: Quality (lint · types · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome (lint + format)
        run: pnpm biome ci .

      - name: TypeScript
        run: pnpm typecheck

      - name: i18n parity check
        run: pnpm i18n:check

      - name: Content integrity check
        run: pnpm content:check
        continue-on-error: true # content/ may be empty during early scaffold

      - name: Unit tests
        run: pnpm test --run --reporter=verbose

  # ---------------------------------------------------------------------------
  # Build (catches RSC / Server Action breakage early)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build (with placeholder env)
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
          RESEND_API_KEY: re_placeholder
          CONTACT_EMAIL_FROM: noreply@example.com
          CONTACT_EMAIL_TO: noreply@example.com
          TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA

  # ---------------------------------------------------------------------------
  # Security: pnpm audit + Trivy filesystem scan
  # ---------------------------------------------------------------------------
  security:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (production)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: true

      - name: Trivy filesystem scan
        # Épinglé sur une version publiée plutôt que sur la branche master.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"

      # Les étapes suivantes ne tournent que si Trivy a produit son rapport :
      # quand une étape précédente échoue, elles n'ajoutent pas d'erreur trompeuse.

      - name: Résumé Trivy dans la page de l'exécution
        if: always() && hashFiles('trivy-results.sarif') != ''
        # Informatif : une erreur de mise en forme ne doit pas faire échouer la CI.
        continue-on-error: true
        run: |
          count=$(jq '[.runs[].results[]] | length' trivy-results.sarif)
          {
            echo "## Trivy : vulnérabilités HIGH et CRITICAL"
            echo
            if [ "$count" -eq 0 ]; then
              echo "Aucune vulnérabilité HIGH ou CRITICAL corrigeable."
            else
              echo "$count résultat(s)."
              echo
              echo "| Règle | Niveau | Fichier | Détail |"
              echo "|---|---|---|---|"
              jq -r '.runs[].results[] | "| \(.ruleId) | \(.level // "") | \(.locations[0].physicalLocation.artifactLocation.uri // "") | \((.message.text // "") | split("\n")[0] | gsub("\\|"; "/")) |"' trivy-results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rapport Trivy en artefact
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 14

      - name: Upload Trivy results to GitHub Security
        # Le code scanning n'existe que sur un dépôt public, ou privé avec
        # GitHub Code Security (payant). Il s'active dans Settings → Code
        # security, puis avec la variable de dépôt CODE_SCANNING_ENABLED=true
        # (Settings → Secrets and variables → Actions → Variables).
        if: always() && hashFiles('trivy-results.sarif') != '' && vars.CODE_SCANNING_ENABLED == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
